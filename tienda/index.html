<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STYLUS · Chaquetas vintage en Bolivia</title>
<meta name="description" content="Chaquetas vintage seleccionadas: Harrington, Retro, Track y Varsity. Piezas únicas, pago con QR y envíos a toda Bolivia por flota.">
<meta name="theme-color" content="#141414">
<meta property="og:title" content="STYLUS · Born to win">
<meta property="og:description" content="Chaquetas vintage seleccionadas. Piezas únicas. Envíos a toda Bolivia.">
<meta property="og:image" content="img/icon-512.png">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: tienda streetwear en crema y negro, tipografía pesada en mayúsculas, fotos grandes; móvil primero. */
:root{
  --bg:#F6F4EF; --paper:#FFFFFF; --ink:#141414; --ink2:#2B2B2B; --muted:#6E6A63; --line:#E2DED6; --soft:#ECE8E0;
  --sold:#B42318; --sale:#C8102E; --ok:#1F7A47; --gold:#C9A227; --wa:#1DA851;
  --display:"Archivo Black","Arial Black",Impact,system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutR:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutR)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:-.2px;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Cinta de anuncios */
.ticker{background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:800;letter-spacing:1.5px;padding:8px 0;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.ticker .tr{display:inline-flex;animation:tick 32s linear infinite}
.ticker span{padding:0 28px}
.ticker span::after{content:"✦";margin-left:28px;color:var(--gold)}
@keyframes tick{to{transform:translateX(-50%)}}
.demo{background:var(--gold);color:var(--ink);font-size:12.5px;font-weight:800;text-align:center;padding:6px 16px}

/* Cabecera */
header.top{position:sticky;top:0;z-index:40;background:rgba(246,244,239,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px}
.hl,.hr{display:flex;gap:4px;align-items:center}
.hr{justify-content:flex-end}
.ib{width:42px;height:42px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink);text-decoration:none}
.ib:hover{background:var(--soft)}
.ib svg{width:24px;height:24px}
.ib .ct{position:absolute;top:3px;right:2px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.brand img{height:26px;width:auto}
nav.desk{display:none;gap:22px;font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase}
nav.desk a{text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
nav.desk a:hover,nav.desk a.on{border-color:var(--ink)}
@media (min-width:900px){nav.desk{display:flex} .hl .menu-b{display:none} header.top .in{grid-template-columns:auto 1fr auto;gap:28px} .brand{order:-1}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;font-weight:800;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;min-height:48px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.out{background:transparent;color:var(--ink)}
.btn.white{background:#fff;color:var(--ink);border-color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 14px;font-size:12.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.link{background:none;border:0;padding:0;font-weight:800;text-decoration:underline;text-underline-offset:4px;cursor:pointer;text-transform:uppercase;font-size:13px;letter-spacing:1px}

/* Portada */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden;min-height:calc(100vh - var(--topH,96px));display:flex;align-items:center}
@supports (height:100svh){.hero{min-height:calc(100svh - var(--topH,96px))}}
.hero>.in{width:100%}
.cue{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;opacity:.85;animation:cue 1.8s ease-in-out infinite}
.cue svg{width:26px;height:26px}
@keyframes cue{50%{transform:translate(-50%,6px)}}
.hero .in{display:grid;gap:22px;padding-block:28px 64px}
.hero h1{font-size:clamp(52px,15vw,132px);letter-spacing:-1px}
.hero h1 em{font-style:normal;-webkit-text-stroke:2px #fff;color:transparent}
.hero p{margin:0;max-width:34ch;color:#d9d6cf;font-size:17px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .strip a{aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#222;display:block}
.hero .strip img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.hero .strip a:hover img{transform:scale(1.05)}
@media (min-width:900px){.hero .in{grid-template-columns:1.1fr 1fr;align-items:center;padding-block:48px 80px}}
.stories{display:flex;gap:14px;overflow-x:auto;padding:18px var(--gutR) 6px var(--gut);scrollbar-width:none;max-width:1180px;margin:0 auto}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;width:76px;text-align:center}
.story .ring{width:72px;height:72px;border-radius:50%;padding:3px;background:conic-gradient(var(--ink),#777,var(--ink))}
.story .ring.new{background:conic-gradient(var(--gold),var(--sale),var(--gold))}
.story .ring i{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden;background:var(--soft)}
.story .ring img{width:100%;height:100%;object-fit:cover}
.story .ring b{display:grid;place-items:center;width:100%;height:100%;font:15px var(--display)}
.story span{font-size:12px;font-weight:700;line-height:1.1}
section.blk{padding-block:34px}
.shead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
.shead h2{font-size:clamp(30px,7vw,48px)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,46%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
@media (min-width:900px){.rail{grid-auto-columns:calc(25% - 9px)}}
.drop{background:var(--ink);color:#fff;border-radius:22px;padding:22px;display:grid;gap:12px;text-align:center}
.drop .cd{display:flex;justify-content:center;gap:10px}
.drop .cd div{background:#fff;color:var(--ink);border-radius:12px;padding:10px 8px;min-width:64px}
.drop .cd b{display:block;font:30px/1 var(--display)}
.drop .cd small{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;background:var(--soft);text-decoration:none;display:block}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cat:hover img{transform:scale(1.04)}
.cat span{position:absolute;left:12px;right:12px;bottom:12px;color:#fff;font:22px/1 var(--display);text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.cat::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.cat span{z-index:1}
.explore-cta{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:16px;text-decoration:none}
.explore-cta .ph{width:92px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:var(--ink);position:relative}
.explore-cta .ph img{width:100%;height:100%;object-fit:cover;opacity:.85}
.explore-cta .ph::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:26px}
.explore-cta h3{font-size:26px}
.steps{display:grid;gap:10px;counter-reset:s}
@media (min-width:900px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:var(--paper);border-radius:18px;padding:18px;border:1px solid var(--line);counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font:16px var(--display);margin-bottom:10px}
.step b{display:block;font-size:17px;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.perks{display:grid;gap:10px}
@media (min-width:900px){.perks{grid-template-columns:repeat(3,1fr)}}
.perk{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--soft)}
.perk svg{width:28px;height:28px;flex:none}
.perk b{display:block}
.perk p{margin:2px 0 0;font-size:14.5px;color:var(--muted)}

/* Tarjeta de prenda */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr);gap:28px 18px}}
.card{position:relative;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0}
.card .ph{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--soft)}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s,transform .5s}
.card .ph .i2{opacity:0}
@media (hover:hover){.card:hover .ph .i2{opacity:1} .card:hover .ph .i1{transform:scale(1.03)}}
.badges{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;z-index:2}
.bdg{background:#fff;color:var(--ink);font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.bdg.k{background:var(--ink);color:#fff} .bdg.sale{background:var(--sale);color:#fff} .bdg.gold{background:var(--gold);color:var(--ink)}
.fav{position:absolute;right:8px;top:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer}
.fav svg{width:19px;height:19px}
.fav.on svg{fill:var(--sale);stroke:var(--sale)}
.stamp{position:absolute;inset:0;display:grid;place-items:center;z-index:1;background:rgba(246,244,239,.45)}
.stamp b{font:22px var(--display);letter-spacing:2px;color:var(--sold);border:3px solid var(--sold);padding:6px 12px;transform:rotate(-12deg);background:rgba(255,255,255,.85);border-radius:6px}
.stamp.res b{color:var(--ink);border-color:var(--ink)}
.card.sold .ph img{filter:grayscale(1)}
.card .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .mk{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.card .tt{font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sz{font-size:13px;color:var(--muted)}
.price{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
.price.sale{color:var(--sale)}

/* Catálogo */
.ctop{padding-block:22px 6px;display:flex;flex-direction:column;gap:12px}
.ctop h1{font-size:clamp(38px,10vw,72px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-decoration:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{border:2px solid var(--line);border-radius:999px;background:var(--paper);padding:8px 12px;font-weight:700;font-size:14px;min-height:42px}
.tog{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--ink)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{display:block;font:24px var(--display);text-transform:uppercase;color:var(--ink);margin-bottom:6px}

/* Prenda */
.pd{display:grid;gap:22px;padding-block:14px 40px}
@media (min-width:900px){.pd{grid-template-columns:1.15fr 1fr;gap:44px;padding-top:28px}}
.gal{position:relative}
.gal .sc{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none;background:var(--soft)}
.gal .sc::-webkit-scrollbar{display:none}
.gal .sc img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;cursor:zoom-in}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{background:var(--ink);width:22px;border-radius:4px}
.thumbs{display:none;gap:8px;margin-top:10px}
.thumbs img{width:72px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.6;border:2px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--ink)}
@media (min-width:900px){.thumbs{display:flex} .dots{display:none}}
.pi{display:flex;flex-direction:column;gap:16px}
.pi h1{font-size:clamp(30px,7vw,46px)}
.pi .price{font-size:26px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fact small{display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fact b{font-size:16px}
.meas{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.meas svg{width:120px;height:auto}
.meas table{border-collapse:collapse;width:100%;font-size:15px}
.meas td{padding:5px 0;border-bottom:1px dashed var(--line)}
.meas td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.acts{display:grid;gap:10px}
.unique{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.unique::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(31,122,71,.15)}
.unique.off::before{background:var(--sold);box-shadow:0 0 0 4px rgba(180,35,24,.15)}

/* Paneles laterales y capas */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:70;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;bottom:0;z-index:71;background:var(--bg);width:min(420px,92vw);display:flex;flex-direction:column;animation:slideR .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.right{right:0} .drawer.left{left:0;animation-name:slideL}
@keyframes slideR{from{transform:translateX(100%)}} @keyframes slideL{from{transform:translateX(-100%)}}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:22px}
.drawer .db{flex:1;overflow:auto;padding:16px}
.drawer .df{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--paper)}
.mnav a{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font:20px var(--display);text-transform:uppercase}
.mnav a small{font:600 13px var(--body);color:var(--muted);text-transform:none}
.citem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.citem img{width:72px;aspect-ratio:4/5;object-fit:cover;border-radius:10px}
.citem b{display:block;line-height:1.2}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;width:58px;height:58px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none}
.fab svg{width:30px;height:30px}

/* Explorar (tipo TikTok) */
.exp{position:fixed;inset:0;z-index:80;background:#000;color:#fff}
.exp .sc{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.exp .sc::-webkit-scrollbar{display:none}
.slide{height:100dvh;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
@supports (height:100dvh){.slide{height:100dvh}}
.slide .bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) brightness(.75);transform:scale(1.1)}
.slide .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding-bottom:120px;padding-top:70px}
.slide .bars{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;gap:4px;z-index:2}
.slide .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.slide .bars i.on{background:#fff}
.slide .info{position:absolute;left:0;right:0;bottom:0;padding:120px 84px calc(24px + env(safe-area-inset-bottom,0px)) 16px;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:2}
.slide .info h3{font-size:28px;margin:4px 0 6px}
.slide .info .price{font-size:22px}
.slide .side{position:absolute;right:10px;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;z-index:3;align-items:center}
.slide .side button{width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer}
.slide .side button svg{width:26px;height:26px}
.slide .side small{display:block;font-size:11px;font-weight:700;margin-top:3px;text-align:center}
.slide .side .on svg{fill:var(--sale);stroke:var(--sale)}
.exp .top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.exp .top img{height:22px}
.exp .top button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.exp .hint{position:absolute;left:50%;top:calc(110px + env(safe-area-inset-top,0px));white-space:nowrap;transform:translateX(-50%);z-index:4;font-weight:700;font-size:13px;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:999px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}

function realAPI(){

    async logout(){ await sb.auth.signOut(); },

function bindProduct(id){
  const p = byId(id); if(!p) return; bindCards();
  const sc = $('#gsc'), dots = $$('#gdots i'), th = $$('#gth img');
  if(sc){ sc.addEventListener('scroll', () => { const i = Math.round(sc.scrollLeft / sc.clientWidth); dots.forEach((d, k) => d.classList.toggle('on', k === i)); th.forEach((d, k) => d.classList.toggle('on', k === i)); }, {passive:true});
    $$('img', sc).forEach(im => im.onclick = () => viewer(p.fotos, +im.dataset.i)); }
  th.forEach(t => t.onclick = () => sc.scrollTo({left:sc.clientWidth * +t.dataset.t, behavior:'smooth'}));
  const b = $('#pBuy'); if(b) b.onclick = () => { if(addToCart(p.id, true)) location.hash = '#checkout'; };
  const a = $('#pAdd'); if(a) a.onclick = () => { if(addToCart(p.id)) render(); };
  $('#pFav').onclick = () => { toggleFav(p.id); render(); };
  $('#pShare').onclick = () => shareP(p);
}
async function shareP(p){
  const url = `${pageURL()}#p/${p.id}`, text = `${p.titulo} – ${bs(p.precio)} en STYLUS`;
  if(navigator.share){ try{ await navigator.share({title:'STYLUS', text, url}); return; }catch(e){ if(e.name === 'AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); toast('Enlace copiado'); }catch(e){ window.open(waLink(`${text}\n${url}`, ''), '_blank'); }
}
function viewer(fotos, i){
  const v = document.createElement('div'); v.className = 'viewer'; v.innerHTML = `<div class="sc">${fotos.map(u => `<img src="${esc(u)}" alt="">`).join('')}</div><button aria-label="Cerrar">✕</button>`;
  document.body.appendChild(v); const sc = $('.sc', v); requestAnimationFrame(() => sc.scrollLeft = sc.clientWidth * i);
  const close = () => { v.remove(); document.removeEventListener('keydown', k); }; const k = e => { if(e.key === 'Escape') close(); };
  $('button', v).onclick = close; document.addEventListener('keydown', k);
}

function openExplore(startId){

  <div class="sc" id="exSc">${list.map(p => { const f = p.fotos && p.fotos.length ? p.fotos : [cover(p)]; const av = isAvail(p);
    return `<div class="slide" data-id="${p.id}" data-k="0"><img class="bg" src="${esc(f[0])}" alt="" loading="lazy"><img class="fg" src="${esc(f[0])}" alt="${esc(p.titulo)}" loading="lazy">${f.length > 1 ? `<div class="bars">${f.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}

    <div class="side"><div><button data-x="fav" class="${favs.includes(p.id) ? 'on' : ''}" aria-label="Favorito">${I.heart}</button><small>Me gusta</small></div><div><button data-x="cart" aria-label="Agregar al carrito" ${av ? '' : 'disabled style="opacity:.4"'}>${I.bag}</button><small>Lo quiero</small></div><div><button data-x="share" aria-label="Compartir">${I.share}</button><small>Compartir</small></div><div><button data-x="info" aria-label="Ver detalles">${I.info}</button><small>Detalles</small></div></div></div>`; }).join('')}</div>
  <div class="hint" id="exHint">Desliza hacia arriba ↑ · toca para ver más fotos</div>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  setTimeout(() => { const h = $('#exHint'); if(h) h.remove(); }, 3500);
  $('#exClose').onclick = () => { closeExplore(); if(location.hash.startsWith('#explorar')) history.length > 1 ? history.back() : (location.hash = '#'); };
  $('#exCart').onclick = () => { openCart(); };
  $$('.slide', ov).forEach(sl => {
    const p = byId(sl.dataset.id); const f = p.fotos && p.fotos.length ? p.fotos : [cover(p)];
    $('.fg', sl).onclick = () => { const k = (+sl.dataset.k + 1) % f.length; sl.dataset.k = k; $('.fg', sl).src = f[k]; $('.bg', sl).src = f[k]; $$('.bars i', sl).forEach((b, i) => b.classList.toggle('on', i === k)); const h = $('#exHint'); if(h) h.remove(); };
    $$('[data-x]', sl).forEach(b => b.onclick = () => { const x = b.dataset.x;
      if(x === 'fav'){ toggleFav(p.id); b.classList.toggle('on', favs.includes(p.id)); }
      if(x === 'cart'){ addToCart(p.id, true) && toast('Agregado al carrito 🛍'); }
      if(x === 'share') shareP(p);

  });

    body = `<div class="chips">${[['pendiente', 'Por confirmar'], ['pagado', 'Pagados'], ['cancelado', 'Cancelados'], ['todos', 'Todos']].map(([k, l]) => `<button class="chip ${ordSt === k ? 'on' : ''}" data-os="${k}">${l} (${admOrders.filter(o => k === 'todos' || o.status === k).length})</button>`).join('')}</div>
    ${list.length ? list.map(o => `<div class="ocard"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font:22px var(--display)">${esc(o.codigo)}</b><span class="st ${o.status}">${o.status}</span></div>
      <div><b>${esc(o.nombre)}</b> · ${esc(o.ciudad)}<br><span class="muted" style="font-size:14px">C.I. ${esc(o.ci)} · Cel. ${esc(o.cel)} · ${new Date(o.creado).toLocaleString('es-BO', {dateStyle:'medium', timeStyle:'short'})}</span>${o.nota ? `<br><span class="muted" style="font-size:14px">Nota: ${esc(o.nota)}</span>` : ''}</div>
      <div class="its">${(o.items || []).map(i => `<img src="${esc(i.foto || 'img/icon-512.png')}" alt="${esc(i.titulo)}" title="${esc(i.titulo)}">`).join('')}</div>
      <div style="font-size:14px">${(o.items || []).map(i => `• ${esc(i.titulo)} (${esc(i.talla || '–')}) – ${bs(i.precio)}`).join('<br>')}</div><div class="tot"><span>Total</span><span>${bs(o.total)}</span></div>
      <div class="bt">${o.status === 'pendiente' ? `<button class="btn sm" data-ok="${o.id}">✓ Pago recibido</button><button class="btn out sm" data-cx="${o.id}">Cancelar</button>` : o.status === 'cancelado' ? `<button class="btn out sm" data-re="${o.id}">Reactivar</button>` : ''}
      <a class="btn wa sm" href="${waLink(o.status === 'pagado' ? `¡Hola ${o.nombre.split(' ')[0]}! 🙌 Confirmamos el pago de tu pedido *${o.codigo}*. Lo despachamos por flota a ${o.ciudad} en 1 día hábil. ¡Gracias por comprar en STYLUS!` : `¡Hola ${o.nombre.split(' ')[0]}! 👋 Te escribimos de STYLUS por tu pedido *${o.codigo}* (${bs(o.total)}).`, '591' + digits(o.cel).slice(-8))}" target="_blank" rel="noopener">${I.wa} Cliente</a>
      <button class="btn out sm" data-cp="${o.id}">Copiar para app STYLUS</button></div></div>`).join('') : '<div class="empty"><b>Sin pedidos aquí</b></div>'}`;
  } else if(admTab === 'ajustes'){
    const f = (id, l, v, t='text', ph='') => `<div class="field"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v ?? '')}" placeholder="${esc(ph)}"></div>`;
    const dl = S.drop_fecha ? new Date(new Date(S.drop_fecha).getTime() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
    body = `<form class="box form" id="sF"><h3 style="font-size:20px">Contacto y redes</h3>${f('sW', 'WhatsApp de la tienda', fmtTel(S.whatsapp), 'tel')}<div class="two">${f('sIg', 'Instagram (usuario)', S.instagram, 'text', 'stylus.bo')}${f('sTk', 'TikTok (usuario)', S.tiktok, 'text', 'stylus.bo')}</div>${f('sCi', 'Ciudad', S.ciudad)}
    <h3 style="font-size:20px">Pago con QR</h3><div style="display:flex;gap:12px;align-items:center"><div class="qr" style="width:120px;padding:6px">${S.qr ? `<img src="${esc(S.qr)}" alt="QR">` : '<span class="muted" style="font-size:12px;text-align:center">Sin QR</span>'}</div><div style="display:grid;gap:8px"><label class="btn out sm">Subir imagen del QR<input type="file" accept="image/*" id="sQr" hidden></label><span class="muted" style="font-size:13px">En la app Yasta: Cobrar → QR → Compartir / Guardar imagen.</span></div></div>
    <div class="two">${f('sTi', 'Titular', S.titular)}${f('sBa', 'Banco / billetera', S.banco)}</div><div class="two">${f('sQv', 'El QR vence el', S.qr_vence || '', 'date')}${f('sRh', 'Minutos de reserva para pagar', S.reserva_min ?? 5, 'number')}</div><span class="muted" style="font-size:13px">Al generar el QR en Yasta, elige la vigencia más larga posible y anota aquí la fecha de vencimiento.</span>
    <h3 style="font-size:20px">Anuncios</h3>${f('sAn', 'Cinta superior (separa con ·)', S.anuncio)}<div class="two"><div class="field"><label for="sDf">Próximo drop</label><input id="sDf" type="datetime-local" value="${dl}"></div>${f('sDt', 'Texto del drop', S.drop_texto)}</div>
    <h3 style="font-size:20px">Textos</h3><div class="field"><label for="sEn">Envíos</label><textarea id="sEn">${esc(S.envio_texto)}</textarea></div><div class="field"><label for="sCa">Cambios y devoluciones</label><textarea id="sCa">${esc(S.cambios_texto)}</textarea></div>
    <button class="btn block" type="submit">Guardar ajustes</button></form>`;
  }
  const qd = qrDaysLeft(); const warn = qd === null ? '' : qd < 0 ? `<div class="note" style="background:#F9E1DF;color:var(--sold)"><b>Tu QR de pago venció.</b> Los clientes ven un aviso para pedírtelo por WhatsApp. Genera uno nuevo en Yasta y súbelo en Ajustes.</div>` : qd <= 10 ? `<div class="note" style="background:#FDF0DA"><b>Tu QR de pago vence en ${qd} día${qd === 1 ? '' : 's'}</b> (${esc(S.qr_vence)}). Genera uno nuevo en Yasta y súbelo en Ajustes.</div>` : '';
  return `<div class="wrap adm">${tabs}${warn}${body}</div>`;
}
function editHTML(){
  const p = edit; const o = (v, cur) => v === cur ? 'selected' : '';
  return `<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:26px">${p.id ? 'Editar prenda' : 'Nueva prenda'}</h2><a class="link" href="#admin/prendas">Cancelar</a></div>
  <form class="box form" id="eF"><div><b style="font-size:13px;letter-spacing:1px;text-transform:uppercase">Fotos</b> <span class="muted" style="font-size:13px">· la primera es la portada. Usa fondo liso y buena luz.</span></div>
  <div class="pgrid" id="pg">${p._ph.map((ph, i) => `<div class="pp ${i ? '' : 'main'}"><img src="${esc(ph.url || ph.prev)}" alt=""><button type="button" class="x" data-px="${i}" aria-label="Quitar">✕</button>${i ? `<button type="button" class="m" data-pm="${i}">Usar de portada</button>` : '<span class="m" style="cursor:default">★ Portada</span>'}</div>`).join('')}
    <label>＋ Cámara<input type="file" accept="image/*" capture="environment" id="eCam" hidden></label><label>＋ Galería<input type="file" accept="image/*" multiple id="eGal" hidden></label></div>
  <div class="field"><label for="eTi">Título</label><input id="eTi" value="${esc(p.titulo || '')}" placeholder="Ej.: Varsity azul marino" required></div>
  <div class="two"><div class="field"><label for="eCa">Categoría</label><select id="eCa">${CATS.map(c => `<option value="${c.k}" ${o(c.k, p.categoria)}>${c.t}</option>`).join('')}</select></div>
  <div class="field"><label for="eGe">Para</label><select id="eGe">${Object.entries(GEN).map(([k, t]) => `<option value="${k}" ${o(k, p.genero)}>${t}</option>`).join('')}</select></div></div>
  <div class="two"><div class="field"><label for="eTa">Talla</label><input id="eTa" list="dlT" value="${esc(p.talla || '')}" placeholder="M"><datalist id="dlT">${TALLAS.map(t => `<option value="${t}">`).join('')}</datalist></div>
  <div class="field"><label for="eMa">Marca</label><input id="eMa" value="${esc(p.marca || '')}" placeholder="Ej.: Adidas, Vintage"></div></div>
  <div class="field"><label for="eEs">Estado</label><select id="eEs">${Object.entries(ESTADOS).map(([k, t]) => `<option value="${k}" ${o(k, p.estado)}>${t}</option>`).join('')}</select></div>
  <div><b style="font-size:13px;letter-spacing:1px;text-transform:uppercase">Medidas en cm (prenda en plano)</b></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="field"><label for="eAn">Ancho</label><input id="eAn" type="number" inputmode="decimal" value="${esc(p.ancho ?? '')}"></div><div class="field"><label for="eLa">Largo</label><input id="eLa" type="number" inputmode="decimal" value="${esc(p.largo ?? '')}"></div><div class="field"><label for="eMg">Manga</label><input id="eMg" type="number" inputmode="decimal" value="${esc(p.manga ?? '')}"></div></div>
  <div class="two"><div class="field"><label for="ePr">Precio (Bs)</label><input id="ePr" type="number" inputmode="decimal" value="${esc(p.precio ?? '')}" required></div><div class="field"><label for="ePa">Precio antes (oferta)</label><input id="ePa" type="number" inputmode="decimal" value="${esc(p.precio_antes ?? '')}" placeholder="Opcional"></div></div>
  <div class="field"><label for="eDe">Descripción</label><textarea id="eDe" placeholder="Detalles, tela, si tiene algún desgaste…">${esc(p.descripcion || '')}</textarea></div>
  <div class="two"><div class="field"><label for="eSt">Estado de venta</label><select id="eSt">${['disponible', 'reservado', 'vendido', 'oculto'].map(s => `<option ${o(s, p.status)}>${s}</option>`).join('')}</select></div>
  <div class="field"><label for="ePd">Publicar desde (drop)</label><input id="ePd" type="datetime-local" value="${p.publicar_desde ? new Date(new Date(p.publicar_desde).getTime() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : ''}"></div></div>
  <label class="tog"><input type="checkbox" id="eDs" ${p.destacado ? 'checked' : ''}> Destacar en la portada</label>
  <p class="err" id="eErr"></p><button class="btn block" type="submit" id="eGo">${p.id ? 'Guardar cambios' : 'Publicar prenda'}</button>
  ${p.id ? `<div class="two"><button type="button" class="btn out sm" id="eSold">Marcar vendida</button><button type="button" class="btn out sm" id="eDel" style="color:var(--sold);border-color:var(--sold)">Eliminar</button></div>` : ''}</form>`;

async function compress(file){
  const url = URL.createObjectURL(file); const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
  const M = 1400; const r = Math.min(1, M / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .82));
}
function readEdit(){ const v = id => $('#' + id).value.trim(); const n = id => v(id) === '' ? null : Number(v(id)); const pd = v('ePd');
  Object.assign(edit, {titulo:v('eTi'), categoria:v('eCa'), genero:v('eGe'), talla:v('eTa').toUpperCase(), marca:v('eMa'), estado:v('eEs'), ancho:n('eAn'), largo:n('eLa'), manga:n('eMg'), precio:n('ePr'), precio_antes:n('ePa'), descripcion:v('eDe'), status:v('eSt'), publicar_desde:pd ? new Date(pd).toISOString() : null, destacado:$('#eDs').checked}); }
function bindAdmin(){
  const lg = $('#lgF'); if(lg){ lg.onsubmit = async e => { e.preventDefault(); $('#lErr').textContent = ''; try{ await API.login($('#lE').value.trim(), $('#lP').value); ADMIN = await API.session(); P = await API.products(); render(); }catch(ex){ $('#lErr').textContent = ex.message; } }; return; }
  const out = $('#aOut'); if(out) out.onclick = async () => { await API.logout(); ADMIN = null; await load(); render(); };
  const nw = $('#aNew'); if(nw) nw.onclick = () => { edit = {categoria:'varsity', genero:'unisex', estado:'muy_bueno', status:'disponible', _ph:[]}; admTab = 'editar'; render(); };
  const q = $('#aQ'); if(q) q.oninput = () => { admQ = q.value; const pos = q.selectionStart; render().then(() => { const n = $('#aQ'); n.focus(); n.setSelectionRange(pos, pos); }); };
  $$('[data-st]').forEach(b => b.onclick = () => { admSt = b.dataset.st; render(); });
  $$('[data-ed]').forEach(r => r.onclick = () => { const p = byId(r.dataset.ed); edit = {...p, _ph:(p.fotos || []).map(url => ({url}))}; admTab = 'editar'; render(); });
  $$('[data-os]').forEach(b => b.onclick = () => { ordSt = b.dataset.os; render(); });
  const findO = id => admOrders.find(o => o.id === id);
  const setO = async (id, s, msg) => { try{ await API.setOrder(findO(id), s); P = await API.products(); toast(msg); render(); }catch(e){ toast('No se pudo actualizar: ' + e.message); } };
  $$('[data-ok]').forEach(b => b.onclick = () => setO(b.dataset.ok, 'pagado', 'Pago confirmado · prendas vendidas'));
  $$('[data-cx]').forEach(b => b.onclick = () => setO(b.dataset.cx, 'cancelado', 'Pedido cancelado · prendas disponibles'));
  $$('[data-re]').forEach(b => b.onclick = () => setO(b.dataset.re, 'pendiente', 'Pedido reactivado'));
  $$('[data-cp]').forEach(b => b.onclick = async () => { const o = findO(b.dataset.cp); const t = `Nombre: ${o.nombre}\nC.I.: ${o.ci}\nCelular: ${digits(o.cel).slice(-8)}\nCiudad: ${o.ciudad}`; try{ await navigator.clipboard.writeText(t); toast('Copiado: pégalo en la app STYLUS → Pegar datos'); }catch(e){ toast('No se pudo copiar'); } });
  // editar
  const eF = $('#eF'); if(eF){
    const addFiles = async files => { readEdit(); for(const f of files){ const blob = await compress(f); edit._ph.push({blob, prev:URL.createObjectURL(blob)}); } render(); };
    $('#eCam').onchange = e => addFiles([...e.target.files]); $('#eGal').onchange = e => addFiles([...e.target.files]);
    $$('[data-px]').forEach(b => b.onclick = () => { readEdit(); edit._ph.splice(+b.dataset.px, 1); render(); });
    $$('[data-pm]').forEach(b => b.onclick = () => { readEdit(); const [x] = edit._ph.splice(+b.dataset.pm, 1); edit._ph.unshift(x); render(); });
    eF.onsubmit = async e => { e.preventDefault(); readEdit(); const err = !edit._ph.length ? 'Agrega al menos una foto.' : !edit.titulo ? 'Escribe un título.' : !(edit.precio > 0) ? 'Escribe el precio.' : '';
      if(err){ $('#eErr').textContent = err; return; }
      const btn = $('#eGo'); btn.disabled = true;
      try{ const urls = []; for(let i = 0; i < edit._ph.length; i++){ const ph = edit._ph[i]; btn.textContent = ph.url ? 'Guardando…' : `Subiendo foto ${i + 1} de ${edit._ph.length}…`; urls.push(ph.url || await API.uploadPhoto(ph.blob)); }
        const row = {...edit, fotos:urls}; delete row._ph; if(row.status !== 'reservado'){ row.reservado_hasta = null; } await API.saveProduct(row); P = await API.products(); toast(edit.id ? 'Prenda actualizada' : 'Prenda publicada ✔'); edit = null; admTab = 'prendas'; location.hash = '#admin/prendas'; render(); }
      catch(ex){ $('#eErr').textContent = 'No se pudo guardar: ' + ex.message; btn.disabled = false; btn.textContent = 'Intentar de nuevo'; } };
    const sd = $('#eSold'); if(sd) sd.onclick = () => { $('#eSt').value = 'vendido'; eF.requestSubmit(); };
    const dl = $('#eDel'); if(dl) dl.onclick = async () => { if(dl.dataset.sure !== '1'){ dl.dataset.sure = '1'; dl.textContent = 'Toca otra vez para eliminar'; return; } await API.deleteProduct(edit.id); P = await API.products(); edit = null; admTab = 'prendas'; toast('Prenda eliminada'); render(); };
  }
  // ajustes
  const sF = $('#sF'); if(sF){
    $('#sQr').onchange = async e => { const f = e.target.files[0]; if(!f) return; toast('Subiendo QR…'); try{ S.qr = await API.uploadPhoto(await compress(f)); await API.saveSettings(S); toast('QR guardado'); render(); }catch(ex){ toast('No se pudo subir el QR'); } };
    sF.onsubmit = async e => { e.preventDefault(); const v = id => $('#' + id).value.trim(); const w = digits(v('sW')); const df = v('sDf');
      Object.assign(S, {whatsapp:w.length === 8 ? '591' + w : w, instagram:v('sIg').replace(/^@/, ''), tiktok:v('sTk').replace(/^@/, ''), ciudad:v('sCi'), titular:v('sTi'), banco:v('sBa'), qr_vence:v('sQv') || null, reserva_min:Math.max(1, parseInt(v('sRh')) || 5), anuncio:v('sAn'), drop_fecha:df ? new Date(df).toISOString() : null, drop_texto:v('sDt'), envio_texto:v('sEn'), cambios_texto:v('sCa')});
      try{ await API.saveSettings(S); chrome(); toast('Ajustes guardados'); }catch(ex){ toast('No se pudo guardar: ' + ex.message); } };
  }
}

/* ---------- Router ---------- */
let renderSeq = 0;
async function render(){
  const seq = ++renderSeq; const h = decodeURIComponent(location.hash.slice(1)); const [r, ...rest] = h.split('/'); const arg = rest.join('/');
  if(r !== 'explorar') closeExplore();
  let html = '', bind = () => {};
  if(r === 'tienda'){ html = vShop(arg ? (arg === 'todo' ? '' : arg) : undefined); bind = bindShop; }
  else if(r === 'p'){ html = vProduct(arg); bind = () => bindProduct(arg); }
  else if(r === 'favoritos'){ html = vFavs(); bind = bindCards; }
  else if(r === 'checkout'){ html = vCheckout(); bind = bindCheckout; }
  else if(r === 'pedido'){ html = vOrder(); bind = bindOrder; }
  else if(r === 'ayuda'){ html = vHelp(); }
  else if(r === 'admin'){ html = await vAdmin(arg); bind = bindAdmin; }
  else if(r === 'explorar'){ if(!loaded){ if(!$('#view').innerHTML){ $('#view').innerHTML = vHome(); } return; } if(!$('#exp')){ if(!$('#view').innerHTML) { $('#view').innerHTML = vHome(); bindHome(); } openExplore(arg); } return; }
  else { html = vHome(); bind = bindHome; }
  if(seq !== renderSeq) return;
  $('#view').innerHTML = html; bind(); counts(); $('#fab').hidden = r === 'admin';
  document.title = r === 'p' && byId(arg) ? `${byId(arg).titulo} · STYLUS` : r === 'admin' ? 'Panel · STYLUS' : 'STYLUS · Chaquetas vintage en Bolivia';
}
let lastRoute = '';
window.addEventListener('hashchange', () => { closeDrawers(); const r = location.hash.split('/')[0]; if(r !== '#admin' || lastRoute !== '#admin') window.scrollTo(0, 0); lastRoute = r; if(r === '#admin'){ edit = null; if(admTab === 'editar') admTab = 'prendas'; } render(); });
$('#bMenu').onclick = openMenu; $('#bCart').onclick = openCart;
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeDrawers(); closeExplore(); } });
(async () => { chrome(); counts(); await render(); await load(); render(); })();
</script>
