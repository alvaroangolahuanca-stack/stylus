<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STYLUS</title>
<meta name="description" content="Membretes de envío, clientes frecuentes y guías por WhatsApp.">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STYLUS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&display=swap">
<style>
/* Layout: app móvil de una columna (máx. 560px). Cabecera negra con la marca, barra inferior de 5 secciones. */
:root{
  --ink:#111111; --ink2:#2A2A2A; --paper:#FFFFFF; --mist:#F3F3F1; --line:#E2E1DD; --muted:#6B6A66;
  --gold:#C9A227; --gold-bg:#FBF3D9; --ok:#1E7F4A; --ok-bg:#E3F4EA; --warn:#A35F00; --warn-bg:#FDF0DA;
  --blue:#2459A0; --blue-bg:#E2ECF8; --bad:#B3261E; --bad-bg:#F9E1DF; --wa:#1DA851;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column}
.top{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .logo{width:46px;height:46px;border-radius:12px;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden;padding:3px}
.top .logo img{width:100%;height:100%;object-fit:contain}
.top .t1{font:20px/1.05 var(--display);letter-spacing:.5px;text-transform:uppercase}
.top .t2{font-size:13px;opacity:.75}
.top .grow{flex:1;min-width:0}
.top .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cnt{background:var(--gold);color:var(--ink);border-radius:999px;font-weight:800;font-size:13px;padding:4px 10px;white-space:nowrap;cursor:pointer;border:0}
main{flex:1;padding:16px max(16px,env(safe-area-inset-right,0px)) 112px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:10px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{stroke-width:2.6}
nav.tabs button.plus .ic{background:var(--ink);color:#fff;border-radius:16px;width:54px;height:40px;display:grid;place-items:center;margin-top:-4px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance}
h2{font:24px var(--display);text-transform:uppercase;letter-spacing:.3px}
h3{font:16px var(--display);text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;color:var(--ink);text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:var(--mist);border-color:transparent}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.big{min-height:60px;font:18px var(--display);text-transform:uppercase;letter-spacing:.6px;border-radius:16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,nav.tabs button:focus-visible{outline:3px solid rgba(201,162,39,.55);outline-offset:2px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper)}
.card.soft{background:var(--mist);border-color:transparent}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;position:relative}
.field label{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.field label img{width:16px;height:16px;object-fit:contain}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:48px;width:100%;font-size:17px}
.field textarea{min-height:84px;resize:vertical;font-size:15px}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:25;background:#fff;border:1.5px solid var(--ink);border-radius:12px;margin-top:4px;box-shadow:0 12px 28px rgba(0,0,0,.18);overflow:hidden}
.sugg button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 12px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button b{display:block}
.sugg button small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:800;white-space:nowrap}
.pill.nuevo{background:var(--mist);color:var(--muted)} .pill.frec{background:var(--blue-bg);color:var(--blue)} .pill.vip{background:var(--gold-bg);color:#7A5B00}
.pill.pend{background:var(--warn-bg);color:var(--warn)} .pill.env{background:var(--blue-bg);color:var(--blue)} .pill.ent{background:var(--ok-bg);color:var(--ok)}
.pill.imp{background:var(--mist);color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;min-height:62px}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:700;line-height:1.2}
.item .nm small{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.badge{width:42px;height:42px;border-radius:12px;background:var(--mist);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.badge.k{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{position:relative}
.search svg{position:absolute;left:12px;top:14px;width:20px;height:20px;color:var(--muted)}
.search input{padding-left:40px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:18px var(--display);text-transform:uppercase;margin-bottom:4px}
.banner{background:var(--gold-bg);color:#5C4400;border-radius:12px;padding:12px 14px;font-weight:600}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border-radius:12px;padding:12px;background:var(--mist)}
.stat b{display:block;font:30px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat.k{background:var(--ink);color:#fff} .stat.k span{color:#bbb}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:14px}
.bar .tr{background:var(--mist);border-radius:6px;height:14px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ink);border-radius:6px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-weight:700;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;background:var(--mist);border-radius:10px;padding:10px}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero img{width:170px}
.hero p{margin:0;opacity:.85}
/* Membrete (vista previa e impresión) */
.lblwrap{overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#fff}
.sheetP{width:215.9mm;height:279.4mm;padding:6.35mm;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);transform-origin:top left}
.lbl{border:.55mm solid #000;display:grid;grid-template-columns:36% 64%;padding:2.5mm 3mm;gap:2mm;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff}
.lbl .lg{display:grid;place-items:center;overflow:hidden}
.lbl .lg img{max-width:100%;max-height:44mm;object-fit:contain}
.lbl .lg .txt{font:900 7mm/1 "Archivo Black",Arial Black,sans-serif;text-align:center;word-break:break-word}
.lbl .fs{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.lbl .no{text-align:right;font-weight:700;font-size:3.4mm;height:4.5mm}
.lbl .f{display:grid;grid-template-columns:6mm 1fr;gap:1.5mm;align-items:end;flex:1}
.lbl .f img{width:5.5mm;height:5.5mm;object-fit:contain;margin-bottom:.8mm}
.lbl .f div{border-bottom:.35mm solid #000;min-height:7mm;font-weight:700;font-size:4.1mm;line-height:1.15;padding-bottom:.6mm;overflow:hidden;word-break:break-word}
/* Recorte de guía */
.cropbox{position:relative;touch-action:none;user-select:none;background:#222;border-radius:10px;overflow:hidden}
.cropbox canvas{display:block;width:100%;height:auto}
.crop{position:absolute;border:2px solid var(--gold);box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.crop i{position:absolute;width:26px;height:26px;background:var(--gold);border-radius:50%;border:3px solid #fff}
.crop i[data-h=tl]{left:-13px;top:-13px} .crop i[data-h=tr]{right:-13px;top:-13px} .crop i[data-h=bl]{left:-13px;bottom:-13px} .crop i[data-h=br]{right:-13px;bottom:-13px}
.guiaimg{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--mist)}
#print{display:none}
@media print{
  @page{size:letter portrait;margin:0}
  body{background:#fff}
  .app,nav.tabs,.ov,.toast{display:none!important}
  #print{display:block}
  #print .sheetP{page-break-after:always;break-after:page;transform:none!important}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="print"></div>

<script>
'use strict';
/* =========================================================
   STYLUS — membretes de envío, clientes y guías por WhatsApp
   Datos guardados en el celular (IndexedDB).
   ========================================================= */
const APP_VERSION = '1.0.2';
const ADMIN_PUB = {kty:'EC',crv:'P-256',x:'4FQodfEaGt87OxQGmwuweN7UhL1yra0rtaM3065_pNU',y:'E4ckp3sAiVOfUVeKxXcGKJjg5U9CezfyCGq2MkF45GU',ext:true};
const PER_SHEET = 8;

/* ---------- Utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n, l=2) => String(n).padStart(l,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fCorta = iso => { const d = new Date(iso); return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const fHora = iso => { const d = new Date(iso); return `${fCorta(iso)}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = (n=10) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join(''); };
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const titleCase = s => String(s||'').toLowerCase().replace(/(^|[\s\-])(\S)/g, (m,a,b) => a + b.toUpperCase());
const digits = s => String(s||'').replace(/\D/g,'');
const fmtNum = n => 'N° ' + pad(n, 4);
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; const b = atob(s); const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; };
const enc = new TextEncoder(), dec = new TextDecoder();
const baseURL = () => location.origin + location.pathname.replace(/index\.html$/,'');
function phoneWA(p){ let d = digits(p); if(!d) return ''; if(d.length === 8) d = '591' + d; return d; }
const validPhone = p => { const d = digits(p); return (d.length === 8 && /^[67]/.test(d)) || (d.length === 11 && /^591[67]/.test(d)); };
let toastT;
function toast(msg){ let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
async function copyText(txt, ok='Copiado'){ try{ await navigator.clipboard.writeText(txt); toast(ok); return true; }catch(e){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); let r = false; try{ r = document.execCommand('copy'); }catch(_){} ta.remove(); if(r) toast(ok); return r; } }
function openWA(phone, text){ const p = phoneWA(phone); window.open((p ? `https://wa.me/${p}` : 'https://wa.me/') + '?text=' + encodeURIComponent(text), '_blank'); }
function downloadBlob(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
async function shareOrDownload(blob, name, text){
  const file = new File([blob], name, {type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share(text ? {files:[file], text} : {files:[file]}); return 'shared'; }catch(e){ if(e.name === 'AbortError') return 'cancel'; } }
  downloadBlob(blob, name); return 'download';
}
function loadScript(src){ return new Promise((ok, no) => { if($(`script[src="${src}"]`) && window.__loaded && window.__loaded[src]) return ok(); const s = document.createElement('script'); s.src = src; s.onload = () => { (window.__loaded = window.__loaded || {})[src] = 1; ok(); }; s.onerror = no; document.head.appendChild(s); }); }
const blobToDataURL = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
const dataURLToBlob = async u => (await fetch(u)).blob();

/* ---------- Base de datos (IndexedDB) ---------- */
const DB = {
  db:null,
  open(){ return new Promise((ok, no) => { const r = indexedDB.open('stylus', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); }; r.onsuccess = () => { this.db = r.result; ok(); }; r.onerror = () => no(r.error); }); },
  get(st, k){ return new Promise(ok => { try{ const q = this.db.transaction(st).objectStore(st).get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); }catch(e){ ok(undefined); } }); },
  set(st, k, v){ return new Promise((ok, no) => { const tx = this.db.transaction(st, 'readwrite'); tx.objectStore(st).put(v, k); tx.oncomplete = () => ok(); tx.onerror = () => no(tx.error); }); },
  del(st, k){ return new Promise(ok => { const tx = this.db.transaction(st, 'readwrite'); tx.objectStore(st).delete(k); tx.oncomplete = () => ok(); tx.onerror = () => ok(); }); },
  keys(st){ return new Promise(ok => { const q = this.db.transaction(st).objectStore(st).getAllKeys(); q.onsuccess = () => ok(q.result || []); q.onerror = () => ok([]); }); }
};
function defaultCfg(){
  return {
    marca:'STYLUS', lema:'Born to win', logo:'default', nextNum:1,
    nivFrec:3, nivVip:6,
    descOn:true, descCada:5, descPct:10, vipOn:false, vipPct:5,
    msgRec:'¡Hola {nombre}! 👋 Recibimos tu pedido *{pedido}* en *{marca}*. Te avisaremos cuando sea enviado a {ciudad}. ¡Gracias por tu compra!',
    msgEnv:'📦 ¡Hola {nombre}! Tu pedido *{pedido}* ya fue enviado a *{ciudad}*.{guia} Te enviamos la foto de la guía de envío. ¡Gracias por confiar en *{marca}*!',
    msgEnt:'🙌 ¡Hola {nombre}! Esperamos que disfrutes tu pedido {pedido}. Gracias por elegir *{marca}*. ¡Te esperamos pronto!',
    msgPromo:'🎁 ¡Hola {nombre}! Por ser cliente *{nivel}* de *{marca}*, tienes *{descuento}% de descuento* en tu próxima compra. ¡Te esperamos!',
    msgDesc:'🎉 Por ser tu {n}.º pedido tienes *{descuento}% de descuento*.'
  };
}
let cfg = defaultCfg(), clients = [], orders = [], lic = null;
const LSget = (k, d) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const LSset = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
async function loadAll(){
  await DB.open();
  cfg = Object.assign(defaultCfg(), await DB.get('kv', 'cfg') || {});
  clients = await DB.get('kv', 'clients') || [];
  orders = await DB.get('kv', 'orders') || [];
  lic = await DB.get('kv', 'lic') || LSget('stylus_lic', null);
}
const saveCfg = () => DB.set('kv', 'cfg', cfg);
const saveClients = () => DB.set('kv', 'clients', clients);
const saveOrders = () => DB.set('kv', 'orders', orders);
const saveLic = () => { DB.set('kv', 'lic', lic); LSset('stylus_lic', lic); };

/* ---------- Íconos ---------- */
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  box: sv('<path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="m3 8 9 5 9-5M12 13v8"/>'),
  users: sv('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),

function imgSize(src){ return new Promise(ok => { const i = new Image(); i.onload = () => ok({w:i.naturalWidth, h:i.naturalHeight}); i.onerror = () => ok({w:1, h:1}); i.src = src; }); }
async function fileToImage(file){ const u = await blobToDataURL(file); return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u; }); }
async function logoFromFile(file){

function countOf(cid){ return orders.reduce((a, o) => a + (o.cid === cid ? 1 : 0), 0); }
function levelOf(n){ return n >= cfg.nivVip ? {k:'vip', t:'VIP'} : n >= cfg.nivFrec ? {k:'frec', t:'Frecuente'} : {k:'nuevo', t:'Nuevo'}; }
function discountFor(nextN, level){ // nextN = número del pedido que se está registrando
  const out = [];
  if(cfg.descOn && Number(cfg.descCada) > 0 && nextN % Number(cfg.descCada) === 0) out.push({pct:Number(cfg.descPct), why:`es su ${nextN}.º pedido`});
  if(cfg.vipOn && level.k === 'vip') out.push({pct:Number(cfg.vipPct), why:'es cliente VIP'});
  if(!out.length) return null;
  const best = out.sort((a, b) => b.pct - a.pct)[0]; return best;
}
function fillTpl(tpl, o, extra={}){
  const c = clients.find(x => x.id === o.cid) || {}; const n = countOf(o.cid); const lv = levelOf(n);
  return String(tpl).replace(/\{(\w+)\}/g, (m, k) => ({

}

const CIUDADES = ['La Paz','El Alto','Cochabamba','Santa Cruz','Santa Cruz de la Sierra','Oruro','Potosí','Sucre','Tarija','Trinidad','Cobija','Uyuni','Quillacollo','Sacaba','Tiquipaya','Colcapirhua','Vinto','Punata','Cliza','Tarata','Aiquile','Ivirgarzama','Chimoré','Villa Tunari','Shinahota','Entre Ríos','Montero','Warnes','Cotoca','La Guardia','Mineros','Yapacaní','San Julián','Camiri','Puerto Suárez','Puerto Quijarro','San Ignacio de Velasco','San José de Chiquitos','Roboré','Concepción','Ascensión de Guarayos','Vallegrande','Samaipata','Comarapa','Riberalta','Guayaramerín','Rurrenabaque','San Borja','Santa Ana del Yacuma','Yacuiba','Villamontes','Bermejo','Entre Ríos','Padcaya','Villazón','Tupiza','Llallagua','Uncía','Betanzos','Tupiza','Cotagaita','Huanuni','Challapata','Caracollo','Machacamarca','Poopó','Huari','Viacha','Achacachi','Copacabana','Caranavi','Coroico','Patacamaya','Sica Sica','Desaguadero','Chulumani','Guaqui','Laja','Monteagudo','Camargo','Padilla','Tarabuco','Muyupampa','Puerto Villarroel','Pailón','Okinawa','San Matías','Magdalena','Reyes','Santa Rosa','Porvenir','Villa Montes','Yotala','Zudáñez','Sorata'];
const UNIQ_CIUDADES = [...new Set(CIUDADES)];
function knownCities(){ const s = new Set(UNIQ_CIUDADES); clients.forEach(c => c.ciudad && s.add(c.ciudad)); return [...s].sort((a, b) => a.localeCompare(b, 'es')); }
function parseClient(txt){
  const res = {nombre:'', ciudad:'', ci:'', cel:''}; let t = ' ' + String(txt||'').replace(/\r/g,'\n') + ' ';
  const take = (re, g=1) => { const m = t.match(re); if(m){ t = t.replace(m[0], ' \n '); return (m[g]||'').trim(); } return ''; };
  // Datos con etiqueta
  res.nombre = take(/(?:nombre(?:s)?(?:\s+(?:completo|y\s+apellidos?))?|cliente|destinatario|para)\s*[:=\-]\s*([^\n,;|]+)/i);
  res.ciudad = take(/(?:ciudad|destino|departamento|env[ií]o\s+a|lugar)\s*[:=\-]\s*([^\n,;|]+)/i);
  const ciL = take(/(?:c\.?\s?i\.?|carnet(?:\s+de\s+identidad)?|c[eé]dula|ci)\s*(?:n[°ºo.]*)?\s*[:=\-]?\s*(\d{5,10}(?:\s?-?\s?[0-9][A-Z])?(?:\s?(?:LP|CB|SC|OR|PT|CH|TJ|BE|PD|L\.?P\.?|C\.?B\.?|S\.?C\.?|O\.?R\.?|P\.?T\.?))?)\b/i);
  const celL = take(/(?:cel(?:ular)?|tel(?:[eé]fono|f)?|whats?app|wsp|n[uú]mero|contacto|cell?)\s*(?:n[°ºo.]*)?\s*[:=\-]?\s*((?:\+?\s?591[\s\-]?)?[67](?:[\s\-]?\d){7})/i);
  res.ci = ciL ? ciL.toUpperCase().replace(/\s+/g,' ') : ''; res.cel = celL ? digits(celL).slice(-8) : '';
  // Sin etiqueta: celulares y C.I.
  if(!res.cel){ const m = t.match(/(?:\+?591[\s\-]?|\b)([67](?:[\s\-]?\d){7})\b/); if(m){ res.cel = digits(m[1]); t = t.replace(m[0], ' \n '); } }
  if(!res.ci){ const m = t.match(/\b(\d{5,10})(\s?-?\s?[0-9][A-Z])?(\s?(?:LP|CB|SC|OR|PT|CH|TJ|BE|PD))?\b/i); if(m){ res.ci = m[0].toUpperCase().trim(); t = t.replace(m[0], ' \n '); } }
  // Ciudad conocida
  if(!res.ciudad){
    const nt = norm(t); let best = null;
    knownCities().forEach(c => { const nc = norm(c); const re = new RegExp('(^|[^a-z])' + nc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '([^a-z]|$)'); const m = nt.match(re); if(m && (!best || nc.length > best.n.length)) best = {c, n:nc, i:m.index}; });
    if(best){ res.ciudad = best.c; const idx = t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().indexOf(best.n); if(idx >= 0) t = t.slice(0, idx) + ' \n ' + t.slice(idx + best.n.length); }
  } else { const k = knownCities().find(c => norm(c) === norm(res.ciudad)); res.ciudad = k || titleCase(res.ciudad); }
  // Nombre: el primer fragmento con 2+ palabras y sin números
  if(!res.nombre){
    const stop = /^(hola|buen[oa]s?|d[ií]as|tardes|noches|quiero|mis|datos|son|env[ií]o|enviar|por|favor|gracias|ci|c\.i\.|cel|celular|nombre|ciudad|a|de|del|la|el|y|mi|para|carnet|soy|me|llamo|es|n[°º]|numero|número)$/i;
    const parts = t.split(/[\n,;|]+/).map(s => s.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ\s.'\-]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
    for(const p of parts){ const w = p.split(' ').filter(x => x.length > 1 && !stop.test(x)); if(w.length >= 2){ res.nombre = w.join(' '); break; } }
    if(!res.nombre){ const p = parts.map(p => p.split(' ').filter(x => x.length > 1 && !stop.test(x)).join(' ')).find(Boolean); if(p) res.nombre = p; }
  }
  res.nombre = titleCase(res.nombre.replace(/\s+/g,' ').trim());
  return res;
}

/* ---------- Activación y códigos ---------- */
async function pubKey(){ return crypto.subtle.importKey('jwk', ADMIN_PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']); }
async function verifyCode(code){
  code = String(code||'').trim(); const m = code.match(/#c=([^&\s]+)/); if(m) code = m[1]; code = code.replace(/\s+/g,'');
  const [p, s] = code.split('.'); if(!p || !s) throw new Error('El código no tiene el formato correcto.');
  let ok = false; try{ ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, await pubKey(), ub64u(s), ub64u(p)); }catch(e){ ok = false; }
  if(!ok) throw new Error('Código inválido. Pide un código nuevo al administrador.');
  const [id, name, exp, plan] = dec.decode(ub64u(p)).split('|');
  if(exp && exp !== '0' && exp < today().replace(/-/g,'')) throw new Error('Tu código venció el ' + fmtExp(exp) + '. Pide la renovación al administrador.');
  return {role:'user', id, name, exp, plan:plan || '', code};
}
const fmtExp = e => e && e !== '0' ? `${e.slice(6)}/${e.slice(4,6)}/${e.slice(0,4)}` : 'sin límite';
async function importAdminKey(d){ return crypto.subtle.importKey('jwk', {...ADMIN_PUB, d}, {name:'ECDSA', namedCurve:'P-256'}, false, ['sign']); }
async function verifyMaster(txt){
  const d = String(txt||'').trim().replace(/^STY-ADMIN-/,'').replace(/\s+/g,''); let ok = false;
  try{ const sig = await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, await importAdminKey(d), enc.encode('prueba')); ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, await pubKey(), sig, enc.encode('prueba')); }catch(e){ ok = false; }
  if(!ok) throw new Error('Clave maestra incorrecta.');
  return {role:'owner', id:'owner', name:'Administrador', key:d};
}
async function makeCode(name, exp, plan){
  const id = uid(6); const payload = `${id}|${String(name).replace(/\|/g,' ').trim()}|${exp ? exp.replace(/-/g,'') : '0'}|${plan}`;
  const sig = await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, await importAdminKey(lic.key), enc.encode(payload));
  return {id, code: b64u(enc.encode(payload)) + '.' + b64u(sig)};
}
async function checkLicense(){
  if(!lic) return false;
  try{ if(lic.role === 'owner') await verifyMaster(lic.key); else { const v = await verifyCode(lic.code); lic.exp = v.exp; } }
  catch(e){ lockout(e.message); return false; }
  try{ const r = await fetch('revocados.json', {cache:'no-store'}); if(r.ok){ const j = await r.json(); if((j.ids||[]).includes(lic.id)){ lockout('Tu acceso fue desactivado por el administrador.'); return false; } } }catch(e){}
  return true;
}
let lockMsg = '';
function lockout(msg){ lockMsg = msg; lic = null; DB.del('kv', 'lic'); LSset('stylus_lic', null); route = 'activar'; render(); }
async function activate(v){
  const l = /^STY-ADMIN-/.test(v.trim()) ? await verifyMaster(v) : await verifyCode(v);
  const first = !(await DB.get('kv', 'cfg'));
  lic = l; saveLic(); lockMsg = '';
  if(first && l.role !== 'owner'){ cfg.marca = ''; cfg.lema = ''; cfg.logo = ''; await saveCfg(); }
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  toast(l.role === 'owner' ? 'Bienvenido, administrador' : `Bienvenido(a), ${l.name}`);
  route = (l.role !== 'owner' && !cfg.marca) ? 'cfg' : 'nuevo'; render();
}

function lastOrdersHint(){

function suggest(inp, box, fieldFn){
  const q = norm(inp.value); const qd = digits(inp.value);
  if(q.length < 2 && qd.length < 3){ box.hidden = true; return; }
  const list = clients.map(c => ({c, n:countOf(c.id)})).filter(({c}) => fieldFn(c, q, qd)).sort((a, b) => b.n - a.n).slice(0, 6);
  if(!list.length){ box.hidden = true; return; }
  box.innerHTML = list.map(({c, n}) => `<button type="button" data-c="${c.id}"><div class="badge k num">${n}</div><div style="min-width:0"><b>${esc(c.nombre)}</b><small>${esc([c.ciudad, c.ci && 'C.I. ' + c.ci, c.cel].filter(Boolean).join(' · '))}</small></div></button>`).join('');
  box.hidden = false;
  $$('button', box).forEach(b => b.onmousedown = b.ontouchstart = e => { e.preventDefault(); pickClient(b.dataset.c); });

function pickClient(cid){ const c = clients.find(x => x.id === cid); if(!c) return; draft = Object.assign(draft, {cid:c.id, nombre:c.nombre, ciudad:c.ciudad, ci:c.ci, cel:c.cel}); render(); }
function readDraft(){ draft.nombre = $('#fN').value.trim(); draft.ciudad = $('#fC').value.trim(); draft.ci = $('#fI').value.trim(); draft.cel = $('#fT').value.trim(); const nn = $('#fNum'); if(nn) draft.num = Math.max(1, parseInt(nn.value) || draft.num); const nt = $('#fNo'); if(nt) draft.nota = nt.value.trim(); }

function pasteSheet(){

async function saveDraft(){

  const nombre = titleCase(draft.nombre), ciudad = knownCities().find(c => norm(c) === norm(draft.ciudad)) || titleCase(draft.ciudad);
  // cliente: buscar por id, C.I., celular o nombre exacto
  let c = draft.cid ? clients.find(x => x.id === draft.cid) : null;
  if(!c && digits(draft.ci)) c = clients.find(x => digits(x.ci) === digits(draft.ci));

/* ---------- Guía de envío: foto, recorte y mejora ---------- */
function scanGuide(o){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  sheet(`<h3>Foto de la guía</h3><p class="hint" style="margin:0">Toma la foto sobre una superficie oscura y con buena luz. Luego podrás recortarla.</p>
  <button class="btn pri big block" id="gCam">${I.cam} Tomar foto</button><button class="btn block" id="gGal">Elegir de la galería</button>`, s => {
    $('#gCam', s).onclick = () => { inp.setAttribute('capture', 'environment'); inp.click(); };
    $('#gGal', s).onclick = () => { inp.removeAttribute('capture'); inp.click(); };
  });
  inp.onchange = async () => { const f = inp.files[0]; if(!f) return; try{ const im = await fileToImage(f); cropSheet(o, im); }catch(e){ toast('No se pudo leer la foto'); } };
}
function cropSheet(o, im){
  // escalar a máx 1800 px
  const M = 1800; let r = Math.min(1, M / Math.max(im.width, im.height));
  let src = document.createElement('canvas'); src.width = Math.round(im.width*r); src.height = Math.round(im.height*r); src.getContext('2d').drawImage(im, 0, 0, src.width, src.height);
  let box = {x:.04, y:.04, w:.92, h:.92}, docMode = true;
  sheet(`<h3>Recortar y mejorar</h3><p class="hint" style="margin:0">Arrastra las esquinas amarillas para dejar solo la guía.</p>
  <div class="cropbox" id="cb"><canvas id="cv"></canvas><div class="crop" id="cr"><i data-h="tl"></i><i data-h="tr"></i><i data-h="bl"></i><i data-h="br"></i></div></div>
  <div class="row"><button class="btn sm" id="cRot">${I.rot} Girar</button><label class="btn sm" style="gap:8px"><input type="checkbox" id="cDoc" checked style="width:18px;height:18px;accent-color:#111"> Modo escáner</label></div>
  <div class="field"><label for="cGuia">N° de guía (opcional)</label><input id="cGuia" value="${esc(o.guia || '')}" inputmode="text"></div>
  <button class="btn pri big block" id="cOk">${I.check} Guardar y marcar enviado</button>`, s => {
    const cv = $('#cv', s), cr = $('#cr', s), cb = $('#cb', s);
    const draw = () => { cv.width = src.width; cv.height = src.height; cv.getContext('2d').drawImage(src, 0, 0); place(); };
    const place = () => { cr.style.left = box.x*100 + '%'; cr.style.top = box.y*100 + '%'; cr.style.width = box.w*100 + '%'; cr.style.height = box.h*100 + '%'; };
    draw();
    let drag = null;
    cr.addEventListener('pointerdown', e => { const h = e.target.dataset.h; const rc = cb.getBoundingClientRect(); drag = {h:h || 'move', sx:e.clientX, sy:e.clientY, b:{...box}, W:rc.width, H:rc.height}; cr.setPointerCapture(e.pointerId); e.preventDefault(); });
    cr.addEventListener('pointermove', e => { if(!drag) return; const dx = (e.clientX - drag.sx)/drag.W, dy = (e.clientY - drag.sy)/drag.H; const b = {...drag.b}; const m = .06;
      if(drag.h === 'move'){ b.x = Math.min(Math.max(0, b.x + dx), 1 - b.w); b.y = Math.min(Math.max(0, b.y + dy), 1 - b.h); }
      else { if(drag.h.includes('l')){ const nx = Math.min(Math.max(0, b.x + dx), b.x + b.w - m); b.w += b.x - nx; b.x = nx; } if(drag.h.includes('r')) b.w = Math.min(Math.max(m, b.w + dx), 1 - b.x);
        if(drag.h.includes('t')){ const ny = Math.min(Math.max(0, b.y + dy), b.y + b.h - m); b.h += b.y - ny; b.y = ny; } if(drag.h.includes('b')) b.h = Math.min(Math.max(m, b.h + dy), 1 - b.y); }
      box = b; place(); });
    cr.addEventListener('pointerup', () => drag = null); cr.addEventListener('pointercancel', () => drag = null);
    $('#cRot', s).onclick = () => { const c = document.createElement('canvas'); c.width = src.height; c.height = src.width; const x = c.getContext('2d'); x.translate(c.width, 0); x.rotate(Math.PI/2); x.drawImage(src, 0, 0); src = c; box = {x:box.y ? 1 - box.y - box.h : 0, y:box.x, w:box.h, h:box.w}; draw(); };
    $('#cDoc', s).onchange = e => docMode = e.target.checked;
    $('#cOk', s).onclick = async () => {
      const sx = Math.round(box.x*src.width), sy = Math.round(box.y*src.height), sw = Math.round(box.w*src.width), sh = Math.round(box.h*src.height);
      const out = document.createElement('canvas'); out.width = sw; out.height = sh; const x = out.getContext('2d'); x.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
      if(docMode) enhanceDoc(out);
      const blob = await new Promise(ok => out.toBlob(ok, 'image/jpeg', .85));
      await DB.set('img', o.id, blob); o.img = true; o.guia = $('#cGuia', s).value.trim(); if(o.estado === 'pend'){ o.estado = 'env'; o.fEnv = new Date().toISOString(); }
      await saveOrders(); render(); toast('Guía guardada · pedido enviado'); orderSheet(o.id);
    };
  });
}
function enhanceDoc(c){
  const x = c.getContext('2d'); const d = x.getImageData(0, 0, c.width, c.height); const p = d.data; const hist = new Uint32Array(256); const n = p.length / 4;
  const L = new Uint8ClampedArray(n);
  for(let i=0, j=0; i<p.length; i+=4, j++){ const l = (p[i]*.299 + p[i+1]*.587 + p[i+2]*.114) | 0; L[j] = l; hist[l]++; }
  let acc = 0, lo = 0, hi = 255; for(let v=0; v<256; v++){ acc += hist[v]; if(acc > n*.02){ lo = v; break; } } acc = 0; for(let v=255; v>=0; v--){ acc += hist[v]; if(acc > n*.25){ hi = v; break; } }
  if(hi - lo < 40){ hi = Math.min(255, lo + 40); }
  for(let i=0, j=0; i<p.length; i+=4, j++){
    const k = Math.max(0, Math.min(255, (L[j] - lo) * 255 / (hi - lo)));
    // conserva un poco de color (sellos) pero aclara el fondo
    const sat = Math.max(p[i], p[i+1], p[i+2]) - Math.min(p[i], p[i+1], p[i+2]);
    if(sat > 60 && k < 230){ const f = k / Math.max(1, L[j]); p[i] = Math.min(255, p[i]*f); p[i+1] = Math.min(255, p[i+1]*f); p[i+2] = Math.min(255, p[i+2]*f); }
    else { p[i] = p[i+1] = p[i+2] = k; }
  }
  x.putImageData(d, 0, 0);
}

async function fetchBytes(u){ const r = await fetch(u); return new Uint8Array(await r.arrayBuffer()); }
async function makeWord(list){

  const thick = {style:D.BorderStyle.SINGLE, size:14, color:'000000'};

        new D.TableCell({width:{size:ICW, type:DXA}, borders:cellNoB, verticalAlign:D.VerticalAlign.BOTTOM, margins:{bottom:40}, children:[new D.Paragraph({spacing:{before:0, after:0}, children:[new D.ImageRun({data:ics[i], transformation:{width:Math.min(w, 22), height:h}})]})]}),

      ]}));

    const right = new D.TableCell({width:{size:ICW + TXW, type:DXA}, borders:cellNoB, verticalAlign:D.VerticalAlign.TOP, children:[
      new D.Paragraph({alignment:D.AlignmentType.RIGHT, spacing:{before:0, after:0}, children:[new D.TextRun({text:o ? fmtNum(o.num) : ' ', bold:true, size:17, font:'Arial'})]}), fields, tiny()]});
    const left = new D.TableCell({width:{size:LOGOW, type:DXA}, borders:cellNoB, verticalAlign:D.VerticalAlign.CENTER, children:[logoPara()]});
    const inner = new D.Table({width:{size:LOGOW + ICW + TXW, type:DXA}, columnWidths:[LOGOW, ICW + TXW], layout:D.TableLayoutType.FIXED, borders:noB, rows:[new D.TableRow({children:[left, right]})]});

    return {properties:{page:{size:{width:12240, height:15840, orientation:D.PageOrientation.PORTRAIT}, margin:{top:360, bottom:200, left:360, right:360, header:0, footer:0}}},
      children:[new D.Table({width:{size:COLW*2, type:DXA}, columnWidths:[COLW, COLW], layout:D.TableLayoutType.FIXED, rows}), tiny()]};
  });

  const blob = await D.Packer.toBlob(doc);

  const r = await shareOrDownload(blob, `Membretes_${(cfg.marca || 'envios').replace(/\W+/g,'')}_${nums}.docx`);

async function exportXLS(){

(async function boot(){
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  try{ await loadAll(); }catch(e){ document.body.innerHTML = '<p style="padding:20px">Este navegador no permite guardar datos. Abre la app en Chrome o Safari (no en modo incógnito).</p>'; return; }
  const h = location.hash;
  if(h.startsWith('#c=')){ const code = h.slice(3); history.replaceState(null, '', location.pathname);
    if(!lic || lic.role !== 'owner'){ try{ await activate(code); return; }catch(e){ route = 'activar'; render(); $('#acCode').value = code; $('#acErr').textContent = e.message; return; } } }
  if(!lic) route = 'welcome';
  render();
  if(lic) checkLicense();
})();
</script>
</body>
</html>
