<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STYLUS · Ropa seleccionada en Bolivia</title>
<meta name="description" content="STYLUS: ropa seleccionada, piezas únicas y envíos a toda Bolivia desde Oruro. Paga con QR y recibe tu pedido. Born to win.">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="STYLUS · Born to win">
<meta property="og:description" content="Ropa seleccionada, piezas únicas. Envíos a toda Bolivia. Paga con QR.">
<meta property="og:image" content="img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&display=swap">
<style>
/* Layout: tienda urbana monocromática. Cinta de anuncios arriba, cabecera fija, historias por categoría, héroe negro, grilla 2→4 columnas, carrito lateral, modo reels a pantalla completa. */
:root{
  --ink:#111111; --ink2:#2B2B2B; --paper:#F7F6F2; --white:#FFFFFF; --line:#E3E1DA; --muted:#6F6C64;
  --gold:#C9A227; --gold-bg:#FBF3D9; --sold:#B3261E; --ok:#1E7F4A; --ok-bg:#E3F4EA; --wa:#1DA851;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
h1,h2,h3{margin:0;font-family:var(--display);text-transform:uppercase;line-height:.98;letter-spacing:.2px;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* cinta */
.ticker{background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:7px 0;padding-top:calc(7px + env(safe-area-inset-top,0px))}
.ticker .tk{display:inline-flex;gap:48px;padding-left:100%;animation:tk 26s linear infinite}
.ticker .tk span::before{content:"✦";margin-right:48px;color:var(--gold)}
@keyframes tk{to{transform:translateX(-100%)}}
/* cabecera */
header.top{position:sticky;top:0;z-index:40;background:rgba(247,246,242,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px}
header.top .logo img{height:26px;width:auto}
header.top .side{display:flex;gap:4px;align-items:center}
header.top .side.r{justify-content:flex-end}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink)}
.ib svg{width:23px;height:23px}
.ib .dot{position:absolute;top:5px;right:4px;min-width:19px;height:19px;border-radius:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.ib:focus-visible,.btn:focus-visible,.chip:focus-visible,.story:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* historias */
.stories{display:flex;gap:14px;overflow-x:auto;padding:16px var(--gutr) 6px var(--gut);scrollbar-width:none;max-width:1180px;margin:0 auto}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;width:72px}
.story .ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(var(--ink),var(--gold),var(--ink))}
.story.seen .ring{background:var(--line)}
.story.on .ring{background:var(--gold)}
.story .ring div{width:100%;height:100%;border-radius:50%;background:var(--white);border:3px solid var(--paper);display:grid;place-items:center;overflow:hidden;font:15px var(--display)}
.story .ring img{width:100%;height:100%;object-fit:cover}
.story span{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
/* héroe */
.hero{background:var(--ink);color:#fff;border-radius:22px;margin:12px 0 0;padding:34px 22px 26px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(44px,12vw,104px);line-height:.88}
.hero h1 em{font-style:normal;-webkit-text-stroke:2px #fff;color:transparent}
.hero p{margin:14px 0 0;max-width:40ch;color:#d9d6cd}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .mark{position:absolute;right:-30px;bottom:-24px;width:min(58%,420px);opacity:.09;pointer-events:none}
.cd{display:flex;gap:8px;margin-top:16px}
.cd div{background:#fff;color:var(--ink);border-radius:12px;padding:8px 10px;min-width:62px;text-align:center}
.cd b{display:block;font:26px/1 var(--display)}
.cd span{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
/* botones */
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:12px 20px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none}
.btn svg{width:19px;height:19px;flex:none}
.btn.k{background:var(--ink);color:#fff}
.btn.w{background:#fff;color:var(--ink);border-color:#fff}
.btn.ow{border-color:#fff;color:#fff}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 14px;font-size:12.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
/* pasos */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.steps div{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px}
.steps b{font:28px/1 var(--display);display:block;margin-bottom:6px}
.steps span{font-size:13.5px;color:var(--ink2)}
@media (max-width:720px){.steps{grid-template-columns:1fr 1fr}}
/* barra de catálogo */
.sec{margin-top:36px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sechead h2{font-size:clamp(28px,6vw,44px)}
.bar{position:sticky;top:60px;z-index:30;background:var(--paper);padding:10px 0;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .x{margin-left:4px;opacity:.7}
/* grilla */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px}}
.card{position:relative;cursor:pointer;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.card .ph{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#EAE8E1}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .35s,transform .5s}
.card .ph img.b{position:absolute;inset:0;opacity:0}
@media (hover:hover){.card:hover .ph img.b{opacity:1}.card:hover .ph img.a{transform:scale(1.03)}}
.card .tags{position:absolute;left:8px;top:8px;right:50px;display:flex;gap:5px;flex-wrap:wrap}
.tag{background:#fff;color:var(--ink);border-radius:6px;padding:3px 7px;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.tag.k{background:var(--ink);color:#fff}
.tag.g{background:var(--gold);color:var(--ink)}
.tag.r{background:var(--sold);color:#fff}
.card .fav{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:grid;place-items:center;cursor:pointer}
.card .fav svg{width:19px;height:19px}
.card .fav.on{color:var(--sold)}
.card .fav.on svg{fill:currentColor}
.soldov{position:absolute;inset:0;background:rgba(247,246,242,.55);display:grid;place-items:center}
.soldov span{font:22px var(--display);color:var(--sold);border:3px solid var(--sold);padding:4px 12px;transform:rotate(-8deg);background:rgba(255,255,255,.8);letter-spacing:1px}
.card .nm{font-weight:700;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12.5px;color:var(--muted);font-weight:600}
.price{font-weight:800;font-size:16px}
.price s{color:var(--muted);font-weight:600;font-size:13px;margin-left:6px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:22px var(--display);text-transform:uppercase;margin-bottom:6px}
/* confianza */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:40px}
.trust div{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.trust svg{width:28px;height:28px;flex:none}
@media (max-width:720px){.trust{grid-template-columns:1fr 1fr}}
/* pie */
footer{background:var(--ink);color:#d9d6cd;margin-top:48px;padding:40px 0 calc(100px + env(safe-area-inset-bottom,0px))}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
footer h4{margin:0 0 10px;color:#fff;font:14px var(--display);text-transform:uppercase;letter-spacing:1px}
footer a,footer button.lnk{display:block;color:#d9d6cd;text-decoration:none;margin:6px 0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
footer .soc{display:flex;gap:8px;margin-top:12px}
footer .soc a{width:42px;height:42px;border-radius:50%;border:1.5px solid #555;display:grid;place-items:center;margin:0}
footer .soc svg{width:19px;height:19px}
footer small{display:block;margin-top:28px;color:#8b877d}
@media (max-width:720px){footer .cols{grid-template-columns:1fr}}
.fab{position:fixed;right:var(--gutr);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25);text-decoration:none}
.fab svg{width:30px;height:30px}
/* paneles */
.ov{position:fixed;inset:0;z-index:60;background:rgba(17,17,17,.5);animation:fd .2s}
@keyframes fd{from{opacity:0}}
.drawer{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);display:flex;flex-direction:column;animation:sl .25s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes sl{from{transform:translateX(30px);opacity:.6}}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:12px var(--gutr) 12px var(--gut);border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:22px}
.drawer .db{flex:1;overflow:auto;padding:16px var(--gutr) 16px var(--gut);display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:14px var(--gutr) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--white)}
.line{display:flex;gap:12px;align-items:center}
.line img{width:64px;height:80px;border-radius:10px;object-fit:cover;flex:none;background:#EAE8E1}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:14.5px;line-height:1.2}
.line .t small{color:var(--muted)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot b{font:28px var(--display)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;min-height:48px;width:100%;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2>*{min-width:0}
.note{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.note.gold{background:var(--gold-bg);border-color:#efe0a8}
.err{color:var(--sold);font-weight:700;font-size:14px}
/* producto */
.pv{position:fixed;inset:0;z-index:55;background:var(--paper);overflow:auto;animation:fd .2s}
.pv .in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.1fr 1fr;gap:32px;padding:16px var(--gutr) 120px var(--gut)}
@media (max-width:820px){.pv .in{grid-template-columns:1fr;gap:18px;padding:0 0 130px}.pv .info{padding:0 var(--gutr) 0 var(--gut)}}
.gal{position:relative}
.gal .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px}
@media (max-width:820px){.gal .sl{border-radius:0}}
.gal .sl::-webkit-scrollbar{display:none}
.gal .sl img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:start;background:#EAE8E1;cursor:zoom-in}
.gal .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gal .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.gal .dots i.on{background:#fff;width:20px;border-radius:4px}
.gal .thumbs{display:flex;gap:8px;margin-top:10px}
.gal .thumbs img{width:64px;height:80px;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.6;border:2px solid transparent}
.gal .thumbs img.on{opacity:1;border-color:var(--ink)}
@media (max-width:820px){.gal .thumbs{display:none}}
.pv .close{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:var(--gutr);z-index:3;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.info{display:flex;flex-direction:column;gap:14px}
.info h1{font-size:clamp(28px,5vw,42px)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.specs div{background:#fff;padding:10px 12px}
.specs span{display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.specs b{font-size:15px}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--white);border-top:1px solid var(--line);padding:12px var(--gutr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut)}
.buybar .in2{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center}
.buybar .price{font:24px var(--display);flex:none;margin-right:auto}
.zoom{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom}
.zoom img{max-width:none;width:100%;height:auto}
/* reels */
.reels{position:fixed;inset:0;z-index:70;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100vh;height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff}
.reel .rs{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.reel .rs::-webkit-scrollbar{display:none}
.reel .rs img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.reel .shade{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.reel .meta{position:absolute;left:var(--gut);right:86px;bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.reel .meta h3{font-size:28px;margin:6px 0}
.reel .meta .price{font:26px var(--display)}
.reel .rb{position:absolute;right:var(--gutr);bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
.reel .rb button{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer}
.reel .rb button svg{width:25px;height:25px}
.reel .rb button.on{color:#ff5a5a}
.reel .rb button.on svg{fill:currentColor}
.reel .rb small{font-size:11px;font-weight:700;margin-top:-10px}
.reels .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:var(--gutr);z-index:2;background:rgba(0,0,0,.4);color:#fff}
.reels .hint{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:var(--gut);z-index:2;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#fff;opacity:.85}
.reel .pg{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:var(--gut);right:var(--gutr);display:flex;gap:4px}
.reel .pg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.reel .pg i.on{background:#fff}
/* pago */
.qrbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrbox img{width:min(260px,80%);border-radius:10px}
.code{font:26px var(--display);letter-spacing:1px;background:var(--gold-bg);border-radius:10px;padding:4px 12px}
.timer{font-weight:800;color:var(--sold)}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.demo{background:var(--gold);color:var(--ink);text-align:center;font-weight:800;font-size:13px;padding:7px 12px}
/* admin */
.adm{max-width:760px;margin:0 auto;padding:20px var(--gutr) 120px var(--gut);display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row img{width:52px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:#EAE8E1}
.row .t{flex:1;min-width:0}
.row .t b{display:block;line-height:1.2}
.row .t small{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
.pill.p{background:var(--gold-bg);color:#7A5B00}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.x{background:#eee;color:var(--muted)}.pill.r{background:#F9E1DF;color:var(--sold)}
.ph-edit{display:flex;gap:8px;flex-wrap:wrap}
.ph-edit .pe{position:relative;width:84px;height:104px;border-radius:10px;overflow:hidden;background:#EAE8E1}
.ph-edit .pe img{width:100%;height:100%;object-fit:cover}
.ph-edit .pe button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:800;cursor:pointer}
.ph-edit .pe .first{position:absolute;left:3px;bottom:3px;background:var(--gold);font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px}
.ph-edit label{width:84px;height:104px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;background:#fff}
.chk{display:flex;gap:10px;align-items:center;font-weight:700}
.chk input{width:20px;height:20px;accent-color:#111}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ticker .tk{padding-left:0}}
</style>
</head>

const demoImgCache = {};
function demoImg(kind, color, accent, view){
  const k = [kind, color, accent, view].join('|'); if(demoImgCache[k]) return demoImgCache[k];
  const W = 800, H = 1000, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const bg = view === 1 ? '#E9E5DA' : view === 2 ? '#DCD7CA' : '#EFECE4'; x.fillStyle = bg; x.fillRect(0, 0, W, H);

  x.save(); x.translate(W/2, H/2); if(view === 2) x.scale(1.5, 1.5); x.fillStyle = color; x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 4;
  const P = pts => { x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill(); x.stroke(); };
  if(kind === 'tee' || kind === 'hoodie' || kind === 'jacket' || kind === 'shirt' || kind === 'sweater'){
    const long = kind !== 'tee'; P([[-150,-300],[-60,-330],[60,-330],[150,-300],[long?300:260,long?120:-120],[long?240:200,long?150:-70],[150,-170],[150,310],[-150,310],[-150,-170],[long?-240:-200,long?150:-70],[long?-300:-260,long?120:-120]]);
    x.fillStyle = accent; if(kind === 'hoodie'){ x.beginPath(); x.ellipse(0,-330,90,55,0,0,Math.PI*2); x.fill(); x.fillRect(-100,90,200,90); }
    else if(kind === 'jacket'){ x.fillRect(-6,-320,12,630); x.fillRect(-120,120,70,10); x.fillRect(50,120,70,10); }
    else if(kind === 'shirt'){ for(let i=-130;i<150;i+=44){ x.globalAlpha = .35; x.fillRect(i,-320,18,630); x.fillRect(-150,i*2,300,18); } x.globalAlpha = 1; x.fillStyle = '#fff'; for(let y=-260;y<300;y+=70){ x.beginPath(); x.arc(0,y,7,0,7); x.fill(); } }
    else if(kind === 'sweater'){ for(let y=-200;y<300;y+=40){ x.fillRect(-150,y,300,6); } }
    else { x.font = '900 70px Arial Black, sans-serif'; x.textAlign = 'center'; x.fillText(accent === '#fff' ? 'B2W' : '★', 0, -60); }
  } else if(kind === 'pants' || kind === 'shorts'){
    const L = kind === 'pants' ? 330 : 40; P([[-140,-330],[140,-330],[160,L],[30,L],[0,-120],[-30,L],[-160,L]]); x.fillStyle = accent; x.fillRect(-140,-330,280,26);
  } else if(kind === 'cap'){
    x.beginPath(); x.ellipse(0,0,190,150,0,Math.PI,0); x.fill(); x.stroke(); x.fillStyle = accent; x.beginPath(); x.ellipse(110,10,170,34,0,0,Math.PI*2); x.fill();
  } else if(kind === 'shoe'){
    P([[-230,40],[-200,-80],[-40,-100],[40,-30],[220,10],[240,90],[-230,90]]); x.fillStyle = accent; x.fillRect(-235,70,475,24);
  }
  x.restore();
  x.fillStyle = 'rgba(17,17,17,.55)'; x.font = '800 26px Arial, sans-serif'; x.fillText('FOTO DE EJEMPLO', 30, H - 34);
  return demoImgCache[k] = c.toDataURL('image/jpeg', .82);
}

const api = {
  async load(){
    if(DEMO){ S = {...DEF, ...LS.get('sty_demo_aj', {})}; products = LS.get('sty_demo_prod', null) || demoProducts(); return; }
    const [a, p] = await Promise.all([sb.from('ajustes').select('data').eq('id', 1).maybeSingle(), sb.from('productos').select('*').order('creado', {ascending:false})]);
    if(a.data && a.data.data) S = {...DEF, ...a.data.data};
    if(p.error) throw p.error; products = p.data || [];

  async crearPedido(ids, cliente, nota){
    if(DEMO){
      const items = ids.map(id => products.find(p => p.id === id)).filter(Boolean);
      const bad = items.find(p => !isAvailable(p)); if(bad || items.length !== ids.length) throw new Error('no_disponible:' + (bad ? bad.nombre : 'prenda'));
      const n = LS.get('sty_demo_n', 0) + 1; LS.set('sty_demo_n', n); const vence = new Date(Date.now() + 30*60000).toISOString();
      items.forEach(p => p.reservado_hasta = vence); LS.set('sty_demo_prod', products);
      const ped = {id:n, codigo:'STY-' + String(n).padStart(4,'0'), creado:new Date().toISOString(), cliente, items:items.map(p => ({id:p.id, nombre:p.nombre, talla:p.talla, precio:p.precio, foto:p.fotos[0] || ''})), total:items.reduce((a, p) => a + Number(p.precio), 0), estado:'pendiente', nota};
      const all = LS.get('sty_demo_ped', []); all.unshift(ped); LS.set('sty_demo_ped', all);
      return {codigo:ped.codigo, total:ped.total, items:ped.items, vence};
    }
    const {data, error} = await sb.rpc('crear_pedido', {p_items:ids, p_cliente:cliente, p_nota:nota || ''});
    if(error) throw new Error(error.message); return data;
  },
  // --- administración ---
  async session(){ if(DEMO) return LS.get('sty_demo_admin', false) ? {user:{email:'demo'}} : null; const {data} = await sb.auth.getSession(); return data.session; },
  async login(email, pass){ if(DEMO){ if(pass !== 'demo') throw new Error('En demostración la contraseña es: demo'); LS.set('sty_demo_admin', true); return; } const {error} = await sb.auth.signInWithPassword({email, password:pass}); if(error) throw new Error('Correo o contraseña incorrectos'); },
  async logout(){ if(DEMO){ LS.set('sty_demo_admin', false); return; } await sb.auth.signOut(); },
  async saveProduct(p){
    if(DEMO){ if(!p.id){ p.id = 'demo-' + Date.now(); p.creado = new Date().toISOString(); products.unshift(p); } else { const i = products.findIndex(x => x.id === p.id); products[i] = {...products[i], ...p}; } LS.set('sty_demo_prod', products); return p; }
    const row = {...p}; delete row.id; delete row.creado;
    const q = p.id ? sb.from('productos').update(row).eq('id', p.id).select().single() : sb.from('productos').insert(row).select().single();
    const {data, error} = await q; if(error) throw new Error(error.message); return data;
  },
  async deleteProduct(id){ if(DEMO){ products = products.filter(p => p.id !== id); LS.set('sty_demo_prod', products); return; } const {error} = await sb.from('productos').delete().eq('id', id); if(error) throw new Error(error.message); },
  async upload(blob, folder='p'){

    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const {error} = await sb.storage.from('fotos').upload(path, blob, {contentType:'image/jpeg', cacheControl:'31536000'}); if(error) throw new Error(error.message);

const now = () => Date.now();
const isReserved = p => p.reservado_hasta && new Date(p.reservado_hasta).getTime() > now();

const isNew = p => now() - new Date(p.creado).getTime() < 7*86400000;
const visible = () => products.filter(p => p.publicado !== false && !(p.publicar_desde && new Date(p.publicar_desde).getTime() > now()) && (!p.vendido || now() - new Date(p.creado).getTime() < 45*86400000));

function tagsHTML(p, full){
  const t = [];
  if(p.vendido) t.push('<span class="tag r">Vendido</span>'); else if(isReserved(p)) t.push('<span class="tag k">Reservado</span>');
  else { if(isNew(p)) t.push('<span class="tag g">Nuevo</span>'); if(p.precio_antes && Number(p.precio_antes) > Number(p.precio)) t.push(`<span class="tag k">-${Math.round((1 - p.precio / p.precio_antes) * 100)}%</span>`); if(t.length < 2 || full) t.push('<span class="tag">Pieza única</span>'); }

}

async function compress(file, max=1400){
  const u = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(file); });
  const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u; });
  const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .84));
}

    try{ await api.saveProduct(np); await api.load(); closeLayer(); toast('Prenda guardada'); admProductos(); }catch(e){ err.textContent = 'No se pudo guardar: ' + e.message; }
  };
  const del = $('#eDel', d); if(del) del.onclick = async () => { if(del.dataset.ok){ await api.deleteProduct(id); await api.load(); closeLayer(); toast('Prenda eliminada'); admProductos(); } else { del.dataset.ok = '1'; del.textContent = 'Toca otra vez para confirmar'; } };
}
function admAjustes(){
  const B = $('#admBody'); const a = {...S};
  const f = (id, l, v, ph='', t='text') => `<div class="field"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v || '')}" placeholder="${esc(ph)}"></div>`;
  const toLocal = iso => { if(!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
  B.innerHTML = `<h3 style="font-size:20px">Pago con QR</h3>
  <div style="display:flex;gap:12px;align-items:center"><div style="width:110px;height:110px;border:2px dashed var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none" id="qrPrev">${a.qr ? `<img src="${esc(a.qr)}" alt="" style="width:100%;height:100%;object-fit:contain">` : '<small style="color:var(--muted)">Sin QR</small>'}</div>
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px">Sube la captura del <b>QR de cobro</b> de tu banco (sin monto fijo).</span><label class="btn sm">Subir QR<input type="file" accept="image/*" hidden id="qrUp"></label></div></div>
  ${f('jTit', 'Titular de la cuenta', a.titular, 'Marcelo Angola Cuenca')}${f('jBan', 'Banco (opcional)', a.banco, 'Ej.: BCP, Banco Unión…')}
  <h3 style="font-size:20px">Contacto y marca</h3>
  <div class="g2">${f('jWa', 'WhatsApp de la tienda', a.whatsapp, '74126858', 'tel')}${f('jCi', 'Ciudad', a.ciudad, 'Oruro')}</div>
  ${f('jLe', 'Frase de la marca', a.lema, 'Born to win')}
  <div class="field"><label for="jTk">Cinta de anuncios (separa con ·)</label><textarea id="jTk">${esc(a.ticker)}</textarea></div>
  <div class="g2">${f('jIg', 'Instagram (usuario)', a.instagram, '@stylus.bo')}${f('jTt', 'TikTok (usuario)', a.tiktok, '@stylus.bo')}</div>${f('jFb', 'Facebook (usuario o página)', a.facebook, 'stylus.bo')}
  <h3 style="font-size:20px">Próximo drop</h3>
  <div class="g2"><div class="field"><label for="jDr">Fecha y hora</label><input id="jDr" type="datetime-local" value="${toLocal(a.drop)}"></div>${f('jDt', 'Texto', a.dropTexto, 'Nuevo drop')}</div>
  <span style="font-size:13px;color:var(--muted)">Muestra una cuenta regresiva en la portada. Para revelar prendas a esa hora, usa “Publicar desde” en cada prenda.</span>
  <h3 style="font-size:20px">Textos</h3>
  <div class="field"><label for="jEn">Envíos</label><textarea id="jEn">${esc(a.envio)}</textarea></div>
  <div class="field"><label for="jCa">Cambios y devoluciones</label><textarea id="jCa">${esc(a.cambios)}</textarea></div>
  <div class="field"><label for="jCt">Categorías (separa con comas)</label><input id="jCt" value="${esc((a.categorias || []).join(', '))}"></div>
  <button class="btn k block" id="jSave">Guardar ajustes</button>`;
  let qr = a.qr;
  $('#qrUp').onchange = async e => { const fl = e.target.files[0]; if(!fl) return; toast('Subiendo QR…'); try{ qr = await api.upload(await compress(fl, 1000), 'qr'); $('#qrPrev').innerHTML = `<img src="${esc(qr)}" alt="" style="width:100%;height:100%;object-fit:contain">`; toast('QR listo, guarda los ajustes'); }catch(err){ toast('Error: ' + err.message); } };
  $('#jSave').onclick = async () => { const v = id => $('#' + id).value.trim();
    const data = {...S, qr, titular:v('jTit'), banco:v('jBan'), whatsapp:digits(v('jWa')) || DEF.whatsapp, ciudad:v('jCi'), lema:v('jLe'), ticker:v('jTk'), instagram:v('jIg'), tiktok:v('jTt'), facebook:v('jFb'),
      drop:v('jDr') ? new Date(v('jDr')).toISOString() : '', dropTexto:v('jDt'), envio:v('jEn'), cambios:v('jCa'), categorias:v('jCt').split(',').map(s => s.trim()).filter(Boolean)};
    try{ await api.saveAjustes(data); renderChrome(); toast('Ajustes guardados'); }catch(e){ toast('Error: ' + e.message); } };
}

/* =========================================================
   Navegación
   ========================================================= */
async function route(){
  const h = location.hash;
  if(h === '#admin'){ renderAdmin(); return; }
  if($('#main').querySelector('.adm')) renderHome();
  if(h.startsWith('#p-')){ openProduct(decodeURIComponent(h.slice(3)), false); return; }
  if(h === '#explorar'){ openReels(); return; }
  if($('.pv')) closeLayer();
}
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#layer').innerHTML){ if($('.pv')) history.back(); else closeLayer(); } });
$('#bSearch').onclick = filterPanel;
$('#bReels').onclick = () => openReels();
$('#bFav').onclick = () => { filt = {...filt, esp:filt.esp === 'fav' ? '' : 'fav'}; closeLayer(); renderHome(); $('#catalogo').scrollIntoView({behavior:'smooth'}); };
$('#bCart').onclick = openCart;
document.addEventListener('click', e => { const b = e.target.closest('[data-info]'); if(b && !b.closest('.pv')) infoSheet(b.dataset.info); });

(async function boot(){
  renderChrome();
  $('#main').innerHTML = `<div class="empty" style="padding:80px 10px"><b>Cargando prendas…</b></div>`;
  try{ await api.load(); }catch(e){ $('#main').innerHTML = `<div class="empty"><b>No pudimos cargar la tienda</b>Revisa tu conexión y vuelve a intentar.<br><br><button class="btn k" onclick="location.reload()">Reintentar</button></div>`; return; }
  renderChrome();
  if(location.hash === '#admin') renderAdmin(); else { renderHome(); route(); }
  setInterval(() => { if(!$('#layer').innerHTML && location.hash !== '#admin') api.load().then(() => renderHome()).catch(() => {}); }, 120000);
})();
</script>
